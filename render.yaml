services:
  - type: web
    name: api-videojuegos
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: DATABASE_URL
        fromDatabase:
          name: videojuegos-db
          property: connectionString
databases:
  - name: videojuegos-db
    plan: free
    databaseName: videojuegos
    user: videojuegos
    ipAllowList: []
